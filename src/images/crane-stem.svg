<svg xmlns="http://www.w3.org/2000/svg" width="16" height="32" viewBox="0 0 16 32" role="img" aria-labelledby="title" class="px">
<title>crane-stem.svg - stackable crane mast segment with no margin</title>
<style>.px{shape-rendering:crispEdges}</style>
<!-- outer frame -->
<rect x="0" y="0" width="16" height="32" fill="#20202a"/>
<rect x="2" y="0" width="12" height="32" fill="#d89515"/>
<rect x="4" y="0" width="8" height="32" fill="#ffbf27"/>
<!-- repeatable cross members -->
<rect x="2" y="6" width="12" height="2" fill="#9b5b00"/>
<rect x="2" y="14" width="12" height="2" fill="#9b5b00"/>
<rect x="2" y="22" width="12" height="2" fill="#9b5b00"/>
<rect x="2" y="30" width="12" height="2" fill="#9b5b00"/>
<!-- lattice, tiles cleanly when stacked -->
<path d="M2 0 L12 10 L12 14 L2 4 Z" fill="#9b5b00"/>
<path d="M12 10 L2 20 L2 24 L12 14 Z" fill="#9b5b00"/>
<path d="M2 20 L12 30 L12 32 L8 32 L2 26 Z" fill="#9b5b00"/>
<path d="M12 0 L12 2 L2 12 L2 8 Z" fill="#9b5b00"/>
<path d="M12 18 L2 28 L2 32 L4 32 L12 24 Z" fill="#9b5b00"/>
</svg>
