<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 64 64">
  <title id="title">flying-person-updated.svg</title>
  <desc id="desc">Tiny pixel-style flying person suspended from a red umbrella, inspired by retro City Bloxx visuals.</desc>
  <style>
    svg { shape-rendering: crispEdges; }
    .outline { fill: #1f1f2a; }
    .red { fill: #d83a34; }
    .redHi { fill: #ff6c63; }
    .skin { fill: #e1a15f; }
    .skinHi { fill: #ffd2a2; }
    .shirt { fill: #59c74b; }
    .shirtHi { fill: #84e46f; }
    .pants { fill: #ef7d27; }
    .pantsHi { fill: #ffae57; }
    .shoe { fill: #7a3b16; }
    .handle { fill: #8e5a2b; }
    .shadow { fill: #000000; opacity: 0.14; }
  </style>

  <!-- soft shadow -->
  <rect class="shadow" x="22" y="54" width="18" height="4"/>

  <!-- umbrella top outline -->
  <rect class="outline" x="19" y="8" width="2" height="2"/>
  <rect class="outline" x="21" y="6" width="2" height="2"/>
  <rect class="outline" x="23" y="4" width="18" height="2"/>
  <rect class="outline" x="41" y="6" width="2" height="2"/>
  <rect class="outline" x="43" y="8" width="2" height="2"/>
  <rect class="outline" x="17" y="10" width="2" height="2"/>
  <rect class="outline" x="19" y="12" width="2" height="2"/>
  <rect class="outline" x="21" y="14" width="2" height="2"/>
  <rect class="outline" x="23" y="16" width="20" height="2"/>
  <rect class="outline" x="43" y="14" width="2" height="2"/>
  <rect class="outline" x="45" y="12" width="2" height="2"/>
  <rect class="outline" x="47" y="10" width="2" height="2"/>

  <!-- umbrella fill -->
  <rect class="red" x="23" y="6" width="18" height="2"/>
  <rect class="red" x="19" y="8" width="24" height="2"/>
  <rect class="red" x="17" y="10" width="30" height="2"/>
  <rect class="red" x="19" y="12" width="26" height="2"/>
  <rect class="red" x="21" y="14" width="22" height="2"/>
  <rect class="redHi" x="24" y="8" width="8" height="2"/>
  <rect class="redHi" x="28" y="10" width="6" height="2"/>
  <rect class="redHi" x="34" y="8" width="5" height="2"/>

  <!-- umbrella scallops -->
  <rect class="outline" x="24" y="18" width="2" height="2"/>
  <rect class="outline" x="31" y="18" width="2" height="2"/>
  <rect class="outline" x="38" y="18" width="2" height="2"/>
  <rect class="red" x="23" y="18" width="4" height="2"/>
  <rect class="red" x="30" y="18" width="4" height="2"/>
  <rect class="red" x="37" y="18" width="4" height="2"/>

  <!-- handle -->
  <rect class="outline" x="31" y="18" width="2" height="18"/>
  <rect class="handle" x="31" y="18" width="2" height="16"/>
  <rect class="outline" x="33" y="34" width="2" height="4"/>
  <rect class="handle" x="33" y="34" width="2" height="2"/>
  <rect class="outline" x="35" y="36" width="2" height="2"/>

  <!-- person head -->
  <rect class="outline" x="27" y="28" width="8" height="8"/>
  <rect class="skin" x="29" y="30" width="4" height="4"/>
  <rect class="skinHi" x="29" y="30" width="4" height="2"/>
  <rect class="outline" x="31" y="32" width="1" height="1"/>

  <!-- body / torso -->
  <rect class="outline" x="25" y="36" width="10" height="8"/>
  <rect class="shirt" x="27" y="38" width="6" height="4"/>
  <rect class="shirtHi" x="27" y="38" width="6" height="2"/>

  <!-- arm up to umbrella -->
  <rect class="outline" x="33" y="36" width="4" height="2"/>
  <rect class="skin" x="33" y="36" width="2" height="2"/>
  <rect class="outline" x="35" y="34" width="2" height="2"/>
  <rect class="skin" x="35" y="34" width="2" height="2"/>

  <!-- other arm -->
  <rect class="outline" x="23" y="38" width="4" height="2"/>
  <rect class="skin" x="25" y="38" width="2" height="2"/>

  <!-- legs / lower body -->
  <rect class="outline" x="27" y="44" width="8" height="10"/>
  <rect class="pants" x="28" y="44" width="3" height="6"/>
  <rect class="pants" x="31" y="46" width="3" height="6"/>
  <rect class="pantsHi" x="28" y="44" width="3" height="2"/>
  <rect class="pantsHi" x="31" y="46" width="3" height="2"/>

  <!-- feet -->
  <rect class="outline" x="27" y="52" width="4" height="2"/>
  <rect class="outline" x="32" y="54" width="4" height="2"/>
  <rect class="shoe" x="28" y="52" width="2" height="2"/>
  <rect class="shoe" x="33" y="54" width="2" height="2"/>

  <!-- tiny trailing pixel for motion / bonus readability -->
  <rect class="outline" x="20" y="34" width="2" height="2"/>
  <rect fill="#ffe36d" x="20" y="34" width="2" height="2"/>
</svg>
