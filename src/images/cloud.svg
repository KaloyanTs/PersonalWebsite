<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title" class="px">
<title>cloud.svg - puffy pixel cloud</title>
<style>
  .px { shape-rendering: crispEdges; }
  .shadow { fill: #000; opacity: .12; }
</style>
<rect x="38" y="104" width="84" height="8" class="shadow" rx="4" ry="4"/>

<!-- outline silhouette -->
<rect x="28" y="76" width="12" height="20" fill="#20202a"/>
<rect x="40" y="66" width="16" height="24" fill="#20202a"/>
<rect x="56" y="58" width="16" height="22" fill="#20202a"/>
<rect x="72" y="48" width="20" height="24" fill="#20202a"/>
<rect x="92" y="56" width="18" height="22" fill="#20202a"/>
<rect x="110" y="66" width="14" height="20" fill="#20202a"/>
<rect x="122" y="74" width="10" height="16" fill="#20202a"/>
<rect x="34" y="88" width="92" height="16" fill="#20202a"/>

<!-- filled body -->
<rect x="32" y="80" width="8" height="12" fill="#dcecf9"/>
<rect x="40" y="70" width="16" height="20" fill="#eef7fd"/>
<rect x="56" y="62" width="16" height="18" fill="#f8fbfe"/>
<rect x="72" y="52" width="20" height="20" fill="#ffffff"/>
<rect x="92" y="60" width="18" height="18" fill="#f8fbfe"/>
<rect x="110" y="70" width="12" height="16" fill="#eef7fd"/>
<rect x="34" y="92" width="92" height="8" fill="#eaf5fd"/>
<rect x="40" y="100" width="80" height="4" fill="#c6daec"/>

<rect x="52" y="72" width="56" height="20" fill="#eef7fd"/>
<!-- soft inner puffs -->
<rect x="48" y="76" width="10" height="8" fill="#ffffff" opacity=".72"/>
<rect x="76" y="58" width="12" height="8" fill="#ffffff" opacity=".8"/>
<rect x="96" y="68" width="8" height="6" fill="#ffffff" opacity=".65"/>
</svg>
