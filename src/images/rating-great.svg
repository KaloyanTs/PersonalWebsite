<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" class="px" viewBox="0 0 220 86">
<title>rating-great.svg - retro placement rating badge</title>
<style>
  .px { shape-rendering: crispEdges; }
  .shadow { fill: #000; opacity: .14; }
  .ink { fill: #20202a; }
  .text { font-family: 'Arial Black', Impact, system-ui, sans-serif; font-weight: 900; letter-spacing: 1px; }
</style>
<rect x="30" y="74" width="160" height="8" class="shadow" rx="4" ry="4"/>

<!-- badge outline -->
<rect x="16" y="20" width="188" height="46" class="ink"/>
<rect x="24" y="12" width="172" height="62" class="ink"/>
<rect x="32" y="8" width="156" height="70" class="ink"/>

<!-- badge fill -->
<rect x="24" y="24" width="172" height="38" fill="#42d1ff"/>
<rect x="32" y="16" width="156" height="54" fill="#42d1ff"/>
<rect x="36" y="20" width="148" height="12" fill="#9de0ff" opacity=".82"/>
<rect x="36" y="58" width="148" height="8" fill="#257fbd" opacity=".5"/>

<!-- corner pixels -->
<rect x="20" y="16" width="8" height="8" fill="#257fbd"/>
<rect x="192" y="16" width="8" height="8" fill="#257fbd"/>
<rect x="20" y="62" width="8" height="8" fill="#257fbd"/>
<rect x="192" y="62" width="8" height="8" fill="#257fbd"/>

<!-- tiny spark accents -->
<rect x="38" y="34" width="4" height="12" class="ink"/>
<rect x="34" y="38" width="12" height="4" class="ink"/>
<rect x="39" y="36" width="2" height="8" fill="#fff36d"/>
<rect x="36" y="39" width="8" height="2" fill="#fff36d"/>
<rect x="178" y="40" width="4" height="12" class="ink"/>
<rect x="174" y="44" width="12" height="4" class="ink"/>
<rect x="179" y="42" width="2" height="8" fill="#fff36d"/>
<rect x="176" y="45" width="8" height="2" fill="#fff36d"/>

<!-- outlined text -->
<text x="110" y="53" text-anchor="middle" class="text" font-size="28" fill="#20202a" stroke="#20202a" stroke-width="7" paint-order="stroke">GREAT</text>
<text x="110" y="53" text-anchor="middle" class="text" font-size="28" fill="#ffffff" stroke="#ffffff" stroke-width="2" paint-order="stroke">GREAT</text>
<text x="110" y="53" text-anchor="middle" class="text" font-size="28" fill="#20202a">GREAT</text>
</svg>
